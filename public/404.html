<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>r_and_m</title>
    <script>
      (function () {
        const parts = location.pathname.split('/');
        const base = '/' + parts[1];
        const path = location.pathname.slice(base.length + 1);

        const redirectPath =
          base +
          '?redirect=' +
          encodeURIComponent(path + location.search + location.hash);
        location.replace(redirectPath);
      })();
    </script>
  </head>
  <body></body>
</html>
